# import pygame
import sys

# 1. Initialize the Engine
pygame.init()
screen = pygame.display.set_mode((800, 600))
clock = pygame.time.Clock()
player_pos = [400, 300]

# 2. The Main Game Loop
while True:
    # Check for Events (Inputs)
    for event in pygame.event.get():
        if event.type == pygame.QUIT:
            pygame.quit()
            sys.exit()

    # Movement Logic
    keys = pygame.key.get_pressed()
    if keys[pygame.K_LEFT]:  player_pos[0] -= 5
    if keys[pygame.K_RIGHT]: player_pos[0] += 5
    if keys[pygame.K_UP]:    player_pos[1] -= 5
    if keys[pygame.K_DOWN]:  player_pos[1] += 5

    # Drawing
    screen.fill((20, 20, 40)) # Dark Blue Spooky Sky
    # Draw the "Player" (a green circle for now)
    pygame.draw.circle(screen, (0, 255, 0), player_pos, 15)
    
    pygame.display.flip() # Update the display
    clock.tick(60)        # Maintain 60 Frames Per SecondThis workflow will upload a Python Package to PyPI when a release is created

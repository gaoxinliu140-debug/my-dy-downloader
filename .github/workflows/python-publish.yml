import json

CURRENT_VERSION = "1.1.0"

def migrate_data(old_data):
    """Updates old save data structures to the current version."""
    version = old_data.get("version", "1.0.0")
    
    if version == "1.0.0":
        print("[Migration] Upgrading save from 1.0.0 to 1.1.0...")
        # Imagine version 1.1.0 added 'mana' and 'stamina'
        old_data["mana"] = 50
        old_data["stamina"] = 100
        old_data["version"] = "1.1.0"
        
    return old_data

def save_game_versioned(data):
    # Ensure the version is stamped before saving
    data["version"] = CURRENT_VERSION
    with open("save_game.json", "w") as f:
        json.dump(data, f, indent=4)

def load_game_versioned():
    with open("save_game.json", "r") as f:
        data = json.load(f)
    
    file_version = data.get("version", "1.0.0")
    
    if file_version != CURRENT_VERSION:
        data = migrate_data(data)
        # Save the migrated version immediately
        save_game_versioned(data)
        
    return data
